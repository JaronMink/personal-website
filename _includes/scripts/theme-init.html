<style>
  :root {
    background-color: var(--bg, #fffdf5);
    color: var(--text, #315574);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      background-color: var(--bg, #171c23);
      color: var(--text, #d1e0ef);
      color-scheme: dark;
    }
  }

  html[data-theme='light'] {
    background-color: var(--bg, #fffdf5);
    color: var(--text, #315574);
    color-scheme: light;
  }

  html[data-theme='dark'] {
    background-color: var(--bg, #171c23);
    color: var(--text, #d1e0ef);
    color-scheme: dark;
  }
</style>
<script>
  (function () {
    document.documentElement.classList.add('theme-preload');
    {% if site.palette_preview_enabled %}
    try {
      var palette = window.localStorage.getItem('site-palette');
      if (['tri-pastel', 'blue-rose', 'blue-yellow', 'forest-ivory', 'plum-sage', 'board', 'pastel-vase'].indexOf(palette) !== -1) {
        document.documentElement.setAttribute('data-palette', palette);
      }
    } catch (error) {
      // Private browsing can make local storage unavailable.
    }
    {% endif %}

    var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

    function applyBrowserTheme() {
      document.documentElement.setAttribute('data-theme', query && query.matches ? 'dark' : 'light');
    }

    applyBrowserTheme();

    if (query) {
      if (query.addEventListener) {
        query.addEventListener('change', applyBrowserTheme);
      } else if (query.addListener) {
        query.addListener(applyBrowserTheme);
      }
    }

    window.requestAnimationFrame(function () {
      document.documentElement.classList.remove('theme-preload');
    });
  })();
</script>
