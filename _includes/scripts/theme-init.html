<style>
  :root {
    background-color: #f4ead8;
    color: #243038;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      background-color: #171c23;
      color: #e3e7eb;
      color-scheme: dark;
    }
  }

  html[data-theme='light'] {
    background-color: #f4ead8;
    color: #243038;
    color-scheme: light;
  }

  html[data-theme='dark'] {
    background-color: #171c23;
    color: #e3e7eb;
    color-scheme: dark;
  }
</style>
<script>
  (function () {
    document.documentElement.classList.add('theme-preload');

    var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');

    function applyBrowserTheme() {
      document.documentElement.setAttribute('data-theme', query && query.matches ? 'dark' : 'light');
    }

    applyBrowserTheme();

    if (query) {
      if (query.addEventListener) {
        query.addEventListener('change', applyBrowserTheme);
      } else if (query.addListener) {
        query.addListener(applyBrowserTheme);
      }
    }

    window.requestAnimationFrame(function () {
      document.documentElement.classList.remove('theme-preload');
    });
  })();
</script>
