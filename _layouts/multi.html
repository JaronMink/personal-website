---
layout: base
---
<div class="top-shell">
  <header class="top-bar">
    <div class="top-brand">
      <div class="top-brand-text">
        <a class="top-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
    </div>
    {% include top-nav.html %}
  </header>

  <main id="main-content" tabindex="-1" class="top-main{% if page.url == '/' %} top-main--home{% endif %}{% if page.url == '/publications/' %} top-main--publications{% endif %}{% if page.url == '/bio/' %} top-main--bio{% endif %}{% if page.url == '/teaching/' or page.url == '/service/' %} top-main--list-page{% endif %}">
    {% unless page.hide_page_title %}
    {% if page.url != '/' and page.title %}
    <header class="page-shell-header{% if page.url == '/contact/' %} page-shell-header--ruled{% endif %}">
      <h1 class="page-shell-title">{{ page.title }}</h1>
    </header>
    {% endif %}
    {% endunless %}
    {{ content }}
  </main>
</div>
