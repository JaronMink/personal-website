---
layout: base
---
<div class="top-shell">
  <header class="top-bar">
    <div class="top-brand">
      <div class="top-brand-text">
        <a class="top-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
    </div>
    {% include top-nav.html %}
  </header>

  <main id="main-content" tabindex="-1" class="top-main{% if page.url == '/' %} top-main--home{% endif %}">
    {{ content }}
  </main>
</div>
